services:
  api:
    build: .
    image: cornerstone-pos:local
    environment:
      PORT: 3001
      LOCAL_MONGODB_URI: mongodb://mongodb:27017/cornerstone_pos
      CLOUD_MONGODB_URI: ${CLOUD_MONGODB_URI:-}
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-local-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  aiops:
    build: ./aiops
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      POLL_INTERVAL_SECONDS: 15
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
