global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cornerstone-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]
  - job_name: cornerstone-aiops
    metrics_path: /metrics
    static_configs:
      - targets: ["aiops:9108"]
