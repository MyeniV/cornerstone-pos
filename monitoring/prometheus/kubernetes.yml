global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cornerstone-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cornerstone]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: pos-api
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: http
  - job_name: cornerstone-aiops
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cornerstone]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: pos-aiops
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: metrics
